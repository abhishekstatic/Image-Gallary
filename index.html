
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Image Gallery</h1>
        <p>Explore beautiful moments</p>
    </header>

    <nav class="filters">
        <button class="filter active" data-category="all">All</button>
        <button class="filter" data-category="nature">Nature</button>
        <button class="filter" data-category="flower">Flowers</button>
        <button class="filter" data-category="animals">Animals</button>
    </nav>

    <main class="gallery" id="gallery">

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
                 alt="Beautiful mountain lake">
            <div class="caption">Mountain Lake</div>
        </div>

        <div class="gallery-item" data-category="flower">
            <img src="https://images.unsplash.com/photo-1613539246066-78db6ec4ff0f?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                 alt="beautiful flowers">
            <div class="caption">Blue Daisy (African Daisy)</div>
        </div>

        <div class="gallery-item" data-category="flower">
            <img src="https://plus.unsplash.com/premium_photo-1676475964992-6404b8db0b53?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                 alt="beautiful flowers">
            <div class="caption">Pink Roses, Gerbera Daisies</div>
        </div>

        <div class="gallery-item" data-category="flower">
            <img src="https://images.unsplash.com/photo-1538998073820-4dfa76300194?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                 alt="beautiful flowers">
            <div class="caption">Pink Lotus</div>
        </div>


        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=600"
                 alt="Lion in the wild">
            <div class="caption">Wildlife</div>
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
                 alt="Green forest">
            <div class="caption">Green Forest</div>
        </div>

        <div class="gallery-item" data-category="flower">
            <img src="https://plus.unsplash.com/premium_photo-1676070096487-32dd955e09e0?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                 alt="beautiful flowers">
            <div class="caption">Gerbera Daisy, Carnations</div>
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=600"
                 alt="City buildings">
            <div class="caption">Modern City</div>
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=600"
                 alt="Golden retriever">
            <div class="caption">Golden Retriever</div>
        </div>

    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="close" id="close">&times;</button>
        <button class="prev" id="prev">&#10094;</button>
        <img id="lightbox-img" src="" alt="Selected gallery image">
        <button class="next" id="next">&#10095;</button>
        <p id="lightbox-caption"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
